name: daftari
repository: https://github.com/your-org/daftari

# Melos manages Dart/Flutter packages only.
# TypeScript (backend/*) and C# (PrintServer*) packages are orchestrated
# directly by CI and by the commands documented in AGENTS.md — Melos has no
# concept of non-Dart packages.
packages:
  - apps/daftari
  - landing_page

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    description: "Format check + analyze every Dart/Flutter package"
    run: |
      if grep -q "sdk: flutter" pubspec.yaml; then
        dart format --set-exit-if-changed lib test && flutter analyze
      else
        dart format --set-exit-if-changed lib test && dart analyze
      fi

  test:
    description: "Run tests in every Dart/Flutter package"
    run: |
      if grep -q "sdk: flutter" pubspec.yaml; then
        flutter test
      else
        dart test
      fi

  format:
    description: "Format Dart code in every Dart/Flutter package"
    run: dart format lib test

  build:
    description: "Compile-proof build for Flutter packages"
    run: flutter build apk --debug
    packageFilters:
      flutter: true

  flutter:analyze:
    description: "Format check + analyze Flutter packages"
    run: dart format --set-exit-if-changed lib test && flutter analyze
    packageFilters:
      flutter: true

  flutter:test:
    description: "Run Flutter package tests"
    run: flutter test
    packageFilters:
      flutter: true

  dart:analyze:
    description: "Format check + analyze pure Dart packages"
    run: dart format --set-exit-if-changed lib test && dart analyze
    packageFilters:
      flutter: false
      dirExists: lib

  dart:test:
    description: "Run pure Dart package tests"
    run: dart test
    packageFilters:
      flutter: false
      dirExists: test
