    <circle cx="150" cy="150" r="10"/>
    <circle cx="150" cy="196" r="10"/>
    <circle cx="150" cy="242" r="10"/>
    <circle cx="150" cy="288" r="10"/>
    <circle cx="150" cy="334" r="10"/>
    <circle cx="150" cy="380" r="10"/>
