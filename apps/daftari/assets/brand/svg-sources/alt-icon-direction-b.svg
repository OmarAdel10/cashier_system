      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGradB)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="none" stroke="#1d4ed8" stroke-width="4" opacity="0.08"/>

  <!-- spiral binding (register / notebook) -->
