name = "api-dev"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ENVIRONMENT = "development"
FIREBASE_PROJECT_ID = "daftari-pos"

[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "LOGOS"
bucket_name = "daftari-branding"

# Service binding to the realtime worker.
[[services]]
binding = "REALTIME"
service = "realtime"

[env.staging]
name = "api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
FIREBASE_PROJECT_ID = "daftari-pos"

# R2 buckets are not inherited by environments (wrangler) — redefined per env.
[[env.staging.r2_buckets]]
binding = "LOGOS"
bucket_name = "daftari-branding"

# Service bindings are not inherited by environments (wrangler) — redefined per env.
[[env.staging.services]]
binding = "REALTIME"
service = "realtime"

[env.production]
name = "api"

[env.production.vars]
ENVIRONMENT = "production"
FIREBASE_PROJECT_ID = "daftari-pos"

# R2 buckets are not inherited by environments (wrangler) — redefined per env.
[[env.production.r2_buckets]]
binding = "LOGOS"
bucket_name = "daftari-branding"

# Service bindings are not inherited by environments (wrangler) — redefined per env.
[[env.production.services]]
binding = "REALTIME"
service = "realtime"

# Secrets (set via `npx wrangler secret put` per env):
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, POSTHOG_API_KEY, ADMIN_JWT_SECRET,
# INTERNAL_NOTIFY_SECRET (MUST match the realtime worker's value within the
#  same env; see backend/realtime/src/index.ts /internal/notify)
# (ADMIN_JWT_SECRET signs dashboard session JWTs — MUST match the realtime
#  worker's value within the same env; see shared/src/session_jwt.ts.)
