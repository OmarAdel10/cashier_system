name = "daftari-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ENVIRONMENT = "development"
FIREBASE_PROJECT_ID = "daftari-pos"

[triggers]
crons = ["0 3 * * *"]

[[r2_buckets]]
binding = "LOGOS"
bucket_name = "daftari-branding"

# Service binding to the realtime worker (added in Phase 3).
# [[services]]
# binding = "REALTIME"
# service = "daftari-realtime"

[env.staging]
name = "daftari-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "daftari-api"

[env.production.vars]
ENVIRONMENT = "production"

# Secrets (set via `npx wrangler secret put`):
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, POSTHOG_API_KEY
