name = "admin-dev"
main = "src/index.ts"
compatibility_date = "2024-09-01"

[vars]
ENVIRONMENT = "development"

# Static assets inside `public/` are served by `wrangler deploy`.
# CI runs `flutter build web --wasm` at the repo root, then build.sh
# copies build/web into public/. public/ is gitignored.
[assets]
binding = "ASSETS"
directory = "public"

[env.staging]
name = "admin-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[env.production]
name = "admin"

[env.production.vars]
ENVIRONMENT = "production"
