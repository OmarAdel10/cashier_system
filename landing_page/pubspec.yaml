name: daftari_landing
description: Daftari POS marketing landing page (Jaspr static site)
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ^3.5.0

dependencies:
  jaspr: 0.23.4

dev_dependencies:
  test: ^1.24.0
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  jaspr_builder: 0.23.4

jaspr:
  mode: static
  entrypoint: lib/main.dart
  output: build/jaspr
