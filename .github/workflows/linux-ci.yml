name: Full App Validation & Test Suite (Linux)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - development
      - feature/*

permissions:
  contents: read

jobs:
  validate-and-test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: "3.27.1"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Check Flutter Format
        run: dart format --set-exit-if-changed lib test

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Run All Flutter Unit Tests
        run: flutter test

      - name: Run Windows PrintServer Unit & Integration Tests (platform-aware)
        env:
          MSBUILDDISABLENODEREUSE: 1
        run: dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release --blame-hang-timeout 2m

      - name: Restore Linux Print Sidecar Dependencies
        run: dotnet restore PrintServer.Linux/PrintServer.Linux.csproj -r linux-x64

      - name: Build Linux Print Sidecar
        env:
          MSBUILDDISABLENODEREUSE: 1
        run: dotnet build PrintServer.Linux/PrintServer.Linux.csproj --configuration Release -r linux-x64 --no-restore

      - name: Run Linux Print Sidecar Unit & Integration Tests
        env:
          MSBUILDDISABLENODEREUSE: 1
        run: dotnet test PrintServer.Linux.Tests/PrintServer.Linux.Tests.csproj --configuration Release --blame-hang-timeout 2m