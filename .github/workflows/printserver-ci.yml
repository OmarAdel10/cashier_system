name: CI - PrintServer.Linux

on:
  push:
    branches: [development, master, 'fix/*', 'feature/*', 'refactor/*', 'perf/*', 'chore/*', 'docs/*']
  pull_request:
    branches: [development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab  # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore PrintServer.Linux/PrintServer.Linux.csproj

      - name: Format check
        run: dotnet format PrintServer.Linux/PrintServer.Linux.csproj --verify-no-changes

      - name: Build (Release, linux-x64)
        run: dotnet build PrintServer.Linux/PrintServer.Linux.csproj -c Release -r linux-x64 --nologo

      - name: Test
        run: dotnet test PrintServer.Linux.Tests/PrintServer.Linux.Tests.csproj -c Release --nologo --blame-hang-timeout 2m
