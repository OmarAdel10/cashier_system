name: Staging Validation & Test Suite

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - development
      - feature/*

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@0c61b32c0d770d0a730922c8c7db8b3c4c7f3a23 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@0ce91e83d97224430f53f6f2c942b2b2b6a9c4e6 # v2.17.0
        with:
          flutter-version: "3.24.0"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Check Flutter Format
        run: dart format --set-exit-if-changed lib test

      - name: Run Flutter Static Analysis
        run: flutter analyze

      - name: Run All Flutter Unit Tests
        run: flutter test

      - name: Run .NET Backend Unit & Integration Tests
        env:
          MSBUILDDISABLENODEREUSE: 1
        run: dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release --blame-hang-timeout 2m