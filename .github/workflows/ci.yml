# CI/CD Pipeline for Daftari POS
#
# Matrix: 18 combinations (4 flavors × 3 environments × 3 platforms with exclusions)
# - 4 flavors: local, cloud, admin, landing
# - 3 environments: development, staging, production
# - 3 platforms: windows, linux, web
# - Exclusions per spec §4

name: CI/CD Pipeline

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: ['development', 'master']
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        type: choice
        required: false
        default: 'production'
        options:
          - local
          - cloud
          - admin
          - landing
      env:
        description: 'Environment'
        type: choice
        required: false
        default: 'production'
        options:
          - development
          - staging
          - production

env:
  FLUTTER_VERSION: '3.24.0'
  DART_VERSION: '3.12.0'
  DOTNET_VERSION: '8.0.x'
  FLUTTER_CHANNEL: 'stable'

jobs:
  # ============================================================
  # FLUTTER MATRIX: 4 flavors × 3 envs × 3 platforms with exclusions = 18 combos
  # ============================================================
  flutter-matrix:
    name: Flutter ${{ matrix.flavor }}/${{ matrix.env }}/${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [local, cloud, admin, landing]
        env: [development, staging, production]
        include:
          # Local: Windows, Linux (no web)
          - flavor: local; env: development; os: windows-latest; platform: windows
          - flavor: local; env: development; os: ubuntu-latest; platform: linux
          - flavor: local; env: staging; os: windows-latest; platform: windows
          - flavor: local; env: staging; os: ubuntu-latest; platform: linux
          - flavor: local; env: production; os: windows-latest; platform: windows
          - flavor: local; env: production; os: ubuntu-latest; platform: linux
          # Cloud: Windows, Linux (dev/staging), Windows/Linux/Web (prod)
          - flavor: cloud; env: development; os: windows-latest; platform: windows
          - flavor: cloud; env: development; os: ubuntu-latest; platform: linux
          - flavor: cloud; env: staging; os: windows-latest; platform: windows
          - flavor: cloud; env: staging; os: ubuntu-latest; platform: linux
          - flavor: cloud; env: production; os: windows-latest; platform: windows
          - flavor: cloud; env: production; os: ubuntu-latest; platform: linux
          - flavor: cloud; env: production; os: ubuntu-latest; platform: web
          # Admin: Web only (dev/staging/prod)
          - flavor: admin; env: development; os: ubuntu-latest; platform: web
          - flavor: admin; env: staging; os: ubuntu-latest; platform: web
          - flavor: admin; env: production; os: ubuntu-latest; platform: web
          # Landing: Web only (dev/staging/prod)
          - flavor: landing; env: development; os: ubuntu-latest; platform: web
          - flavor: landing; env: staging; os: ubuntu-latest; platform: web
          - flavor: landing; env: production; os: ubuntu-latest; platform: web
        exclude:
          # Local & Cloud: no web in dev/staging
          - flavor: local; platform: web
          - flavor: cloud; env: development; platform: web
          - flavor: cloud; env: staging; platform: web
          # Admin: no desktop
          - flavor: admin; platform: windows
          - flavor: admin; platform: linux
          # Landing: no desktop
          - flavor: landing; platform: windows
          - flavor: landing; platform: linux
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ matrix.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk-version: ${{ env.DART_VERSION }}

      - name: Install dependencies
        run: |
          if [ "${{ matrix.flavor }}" = "landing" ]; then
            dart pub get
          else
            flutter pub get
          fi

      - name: Build
        run: |
          if [ "${{ matrix.flavor }}" = "landing" ]; then
            dart run jaspr build --dart-define=FLAVOR=${{ matrix.flavor }} --dart-define=ENV=${{ matrix.env }}
          else
            flutter build ${{ matrix.platform }} \
              --dart-define=FLAVOR=${{ matrix.flavor }} \
              --dart-define=ENV=${{ matrix.env }} \
              --${{ matrix.env == 'production' && 'release' || matrix.env == 'staging' && 'profile' || 'debug' }}
          fi

      - name: Run Tests
        run: |
          if [ "${{ matrix.flavor }}" = "landing" ]; then
            dart test
          else
            flutter test
          fi

      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: |
          if [ "${{ matrix.flavor }}" = "landing" ]; then
            dart analyze lib
          else
            flutter analyze
          fi

  # ============================================================
  # PRINTSERVER BUILDS (Windows & Linux)
  # ============================================================
  printserver-build:
    name: PrintServer ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build PrintServer (Windows)
        if: runner.os == 'Windows'
        run: |
          cd PrintServer
          dotnet build -c Release
      - name: Build PrintServer (Linux)
        if: runner.os == 'Linux'
        run: |
          cd PrintServer.Linux
          dotnet build -c Release

  # ============================================================
  # DEPLOY TO CLOUDFLARE PAGES (Landing Page)
  # ============================================================
  deploy-landing:
    name: Deploy Landing Page
    needs: flutter-matrix
    if: github.ref == 'refs/heads/development' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd project_root/frontend/landing_page
          npm ci
      - name: Build
        run: |
          cd project_root/frontend/landing_page
          npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: daftari-landing
          directory: project_root/frontend/landing_page/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # SECURITY SCAN
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
