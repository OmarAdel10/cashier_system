# CI Checks for Daftari POS — verification only, ZERO deploys.
# One purpose per pipeline:
#   ci.yml             → checks (this file, every branch/PR)
#   cd-development.yml → dev deploys (push to development)
#   cd-staging.yml     → staging deploys (push to staging)
#   cd-production.yml  → prod deploys (v* tags)
#   release.yml        → desktop installers (master push + v* tags)
#
# Matrix: 15 combos — local (win+linux), cloud (win+linux), admin (web) × 3 envs.

name: CI Checks

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: [development, staging, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'
  FLUTTER_CHANNEL: 'stable'

jobs:
  # Fast feedback on every push/PR.
  fast-verify:
    name: Fast Verify (fmt, analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-linux-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit Tests
        run: flutter test

      # Landing page is the Jaspr project (not a Flutter flavor) — verify its build too.
      - name: Build landing page
        run: |
          cd landing_page
          dart pub get
          dart pub global activate jaspr_cli 0.23.4
          jaspr build

  # TypeScript workers: api, realtime (DO hub), admin_host, paymob webhook, shared.
  backend-tests:
    name: Backend Workers (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker: [api, realtime, admin_host, paymob_webhook, shared]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Shared source is imported by the workers. Install it first, including
      # dev dependencies required by its tests and TypeScript configuration.
      - name: Install shared dependencies
        run: npm ci --prefix backend/shared --include=dev --no-audit --no-fund

      - name: Install worker dependencies
        run: npm ci --prefix backend/${{ matrix.worker }} --include=dev --no-audit --no-fund

      - name: Unit tests
        run: cd backend/${{ matrix.worker }} && npm test -- --passWithNoTests

      - name: Typecheck
        run: cd backend/${{ matrix.worker }} && npm run typecheck

  # Full flavor×env×platform matrix — main branches and PRs into them only.
  flutter-matrix:
    name: Flutter ${{ matrix.flavor }}/${{ matrix.env }}/${{ matrix.platform }}
    needs: fast-verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJson('["refs/heads/development", "refs/heads/staging", "refs/heads/master"]'), github.ref) ||
      (github.event_name == 'pull_request' && contains(fromJson('["development", "staging", "master"]'), github.base_ref))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # local: Windows + Linux × 3 envs (6)
          - { flavor: local, env: development, os: windows-latest, platform: windows }
          - { flavor: local, env: development, os: ubuntu-latest, platform: linux }
          - { flavor: local, env: staging, os: windows-latest, platform: windows }
          - { flavor: local, env: staging, os: ubuntu-latest, platform: linux }
          - { flavor: local, env: production, os: windows-latest, platform: windows }
          - { flavor: local, env: production, os: ubuntu-latest, platform: linux }
          # cloud: Windows + Linux × 3 envs (6)
          - { flavor: cloud, env: development, os: windows-latest, platform: windows }
          - { flavor: cloud, env: development, os: ubuntu-latest, platform: linux }
          - { flavor: cloud, env: staging, os: windows-latest, platform: windows }
          - { flavor: cloud, env: staging, os: ubuntu-latest, platform: linux }
          - { flavor: cloud, env: production, os: windows-latest, platform: windows }
          - { flavor: cloud, env: production, os: ubuntu-latest, platform: linux }
          # admin: Web × 3 envs (3)
          - { flavor: admin, env: development, os: ubuntu-latest, platform: web }
          - { flavor: admin, env: staging, os: ubuntu-latest, platform: web }
          - { flavor: admin, env: production, os: ubuntu-latest, platform: web }
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          cache-key: flutter-${{ matrix.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build
        shell: bash
        run: |
          BUILD_MODE=release
          if [ "${{ matrix.platform }}" != "web" ]; then
            case "${{ matrix.env }}" in
              production) BUILD_MODE=release ;;
              staging)    BUILD_MODE=profile ;;
              *)          BUILD_MODE=debug ;;
            esac
          fi
          flutter build ${{ matrix.platform }} --$BUILD_MODE \
            --dart-define=FLAVOR=${{ matrix.flavor }} \
            --dart-define=ENV=${{ matrix.env }}

      - name: Run Tests
        run: flutter test

      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

  # C# print servers.
  printserver-build:
    name: PrintServer ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build PrintServer (Windows)
        if: runner.os == 'Windows'
        run: |
          cd PrintServer
          dotnet build -c Release
      - name: Build PrintServer (Linux)
        if: runner.os == 'Linux'
        run: |
          cd PrintServer.Linux
          dotnet build -c Release

  # Filesystem vulnerability scan.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  # Linux packaging (AppImage/RPM) verification + .NET unit tests.
  # Folded from the deleted structural-test.yml; fast-verify's format/analyze/test
  # steps are NOT repeated here. Gated to main branches (heavy Linux env install).
  packaging-verify-linux:
    name: 'Packaging Verify (Linux: AppImage + RPM + .NET tests)'
    needs: fast-verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJson('["refs/heads/development", "refs/heads/staging", "refs/heads/master"]'), github.ref) ||
      (github.event_name == 'pull_request' && contains(fromJson('["development", "staging", "master"]'), github.base_ref))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ED25519_PUBKEY_HEX: ${{ secrets.ED25519_PUBKEY_HEX }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcups2-dev libgtk-3-dev libsecret-1-dev libblkid-dev liblzma-dev \
            clang cmake ninja-build pkg-config libstdc++-12-dev rpm \
            wget curl xvfb desktop-file-utils \
            libappstream-glib8 libappstream-glib-dev
      - name: Install linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Build PrintServer.Linux
        run: dotnet build PrintServer.Linux/PrintServer.Linux.csproj -c Release -r linux-x64
      - name: Run PrintServer.Linux Unit Tests
        run: dotnet test PrintServer.Linux.Tests/PrintServer.Linux.Tests.csproj -c Release --blame-hang-timeout 2m
      - name: Build AppImage (Verification)
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          chmod +x packaging/linux/AppImage/build-appimage.sh
          ./packaging/linux/AppImage/build-appimage.sh "ci-${SHA_SHORT}"
      - name: Build RPM (Verification)
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-8)
          chmod +x packaging/linux/RPM/build-rpm.sh
          ./packaging/linux/RPM/build-rpm.sh "ci-${SHA_SHORT}"
      - name: Smoke Test AppImage
        run: |
          APPIMAGE=$(find build/appimage/output -name "*.AppImage" -type f 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "❌ No AppImage found in build/appimage/output/"
            ls -la build/appimage/output/ 2>/dev/null || true
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null
          test -f squashfs-root/usr/share/cashier-system/cashier-system
          test -f squashfs-root/usr/share/cashier-system/PrintServer/PrintServer.Linux
          test -f squashfs-root/usr/share/cashier-system/PrintServer/Assets/NotoNaskhArabic.ttf
          timeout 10s xvfb-run -a "$APPIMAGE" --help 2>&1 | head -20 || true
          echo "✅ AppImage structure valid"
      - name: Upload Linux Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts-${{ github.sha }}
          path: |
            build/appimage/output/*.AppImage
            build/rpm/output/*.rpm
          retention-days: 7

  packaging-verify-windows:
    name: 'Packaging Verify (Windows: .NET tests)'
    needs: fast-verify
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJson('["refs/heads/development", "refs/heads/staging", "refs/heads/master"]'), github.ref) ||
      (github.event_name == 'pull_request' && contains(fromJson('["development", "staging", "master"]'), github.base_ref))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run .NET Unit & Integration Tests
        env:
          MSBUILDDISABLENODEREUSE: 1
        run: dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release --blame-hang-timeout 2m

  # One required status check for branch protection: fails if any gated check failed.
  ci-summary:
    name: CI Summary (Required)
    needs: [fast-verify, flutter-matrix, backend-tests, printserver-build, packaging-verify-linux, packaging-verify-windows, security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any check failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::One or more CI checks failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
