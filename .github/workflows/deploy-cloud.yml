name: Deploy Cloud (reusable)

on:
  workflow_call:
    inputs:
      pages_project:
        description: 'Cloudflare Pages project for the landing page (daftari | daftari-dev | daftari-staging)'
        required: true
        type: string
      wrangler_env_flag:
        description: 'Wrangler env flag for workers ("" | --env staging | --env production)'
        required: false
        default: ''
        type: string
      flutter_env:
        description: 'dart-define ENV baked into the admin dashboard build'
        required: true
        type: string
      pages_branch:
        description: 'Pages production branch (development | staging | master) — used at project creation and for explicit deploy targeting'
        required: true
        type: string
      deploy_landing:
        description: 'Deploy the landing page (Pages) — set by the caller''s path filter'
        required: false
        default: false
        type: boolean
      deploy_admin:
        description: 'Deploy the admin dashboard (admin_host worker) — set by the caller''s path filter'
        required: false
        default: false
        type: boolean
      deploy_api:
        description: 'Deploy the API worker — set by the caller''s path filter'
        required: false
        default: false
        type: boolean
      deploy_realtime:
        description: 'Deploy the realtime worker — set by the caller''s path filter'
        required: false
        default: false
        type: boolean
      deploy_paymob:
        description: 'Deploy the Paymob webhook worker — set by the caller''s path filter'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy changed components (landing/admin/api/realtime/paymob)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Workers' repo-pinned wrangler (>=4.133) declares engines node>=22
          # and aborts at startup on Node 20, failing every `npx wrangler deploy`.
          node-version: '22'

      - name: Setup Flutter
        if: inputs.deploy_landing || inputs.deploy_admin
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
          cache-key: flutter-deploy-${{ hashFiles('pubspec.lock') }}

      - name: Install Flutter dependencies
        if: inputs.deploy_landing || inputs.deploy_admin
        run: flutter pub get

      # ---------- Landing page (Cloudflare Pages, Jaspr static site) ----------
      - name: Build landing page
        if: inputs.deploy_landing
        run: |
          cd landing_page
          dart pub get
          dart pub global activate jaspr_cli 0.23.4
          jaspr build

      # wrangler pages deploy does NOT auto-create projects non-interactively (fails with
      # "Project not found [code: 8000007]") — create idempotently before the first deploy.
      - name: Ensure Pages project exists (idempotent)
        if: inputs.deploy_landing
        working-directory: landing_page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create ${{ inputs.pages_project }} --production-branch=${{ inputs.pages_branch }} || echo "project already exists — continuing"

      - name: Deploy landing page
        if: inputs.deploy_landing
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing_page
          command: pages deploy build/jaspr --project-name=${{ inputs.pages_project }} --branch=${{ inputs.pages_branch }}

      # ---------- Admin dashboard (Flutter Web WASM via admin_host worker) ----------
      - name: Build admin dashboard (WASM)
        if: inputs.deploy_admin
        run: |
          flutter build web --wasm \
            --dart-define=FLAVOR=admin \
            --dart-define=ENV=${{ inputs.flutter_env }}

      - name: Copy admin assets into admin_host/public
        if: inputs.deploy_admin
        run: |
          cd backend/admin_host
          bash build.sh

      # ---------- Backend workers ----------
      # Install deps for every deploying worker — npx then resolves the repo-pinned
      # local wrangler (4.133.0) from each worker's node_modules. wrangler-action@v3
      # bundles wrangler 3.90.0 whose ^4.x workers-types peer range ERESOLVEs against
      # our v5 — so worker deploys use plain npx with the local binary instead.
      - name: Install worker dependencies
        if: inputs.deploy_admin || inputs.deploy_api || inputs.deploy_realtime || inputs.deploy_paymob
        run: |
          npm ci --prefix backend/shared --include=dev --no-audit --no-fund
          if [ "${{ inputs.deploy_admin }}" = "true" ]; then
            npm ci --prefix backend/admin_host --include=dev --no-audit --no-fund
          fi
          if [ "${{ inputs.deploy_api }}" = "true" ]; then
            npm ci --prefix backend/api --include=dev --no-audit --no-fund
          fi
          if [ "${{ inputs.deploy_realtime }}" = "true" ]; then
            npm ci --prefix backend/realtime --include=dev --no-audit --no-fund
          fi
          if [ "${{ inputs.deploy_paymob }}" = "true" ]; then
            npm ci --prefix backend/paymob_webhook --include=dev --no-audit --no-fund
          fi

      - name: Deploy admin host worker
        if: inputs.deploy_admin
        working-directory: backend/admin_host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy ${{ inputs.wrangler_env_flag }}

      - name: Deploy API worker
        if: inputs.deploy_api
        working-directory: backend/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy ${{ inputs.wrangler_env_flag }}

      - name: Deploy realtime worker (Durable Objects)
        if: inputs.deploy_realtime
        working-directory: backend/realtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy ${{ inputs.wrangler_env_flag }}

      - name: Deploy Paymob webhook
        if: inputs.deploy_paymob
        working-directory: backend/paymob_webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy ${{ inputs.wrangler_env_flag }}
