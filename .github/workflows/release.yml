# Desktop releases — Windows (Shorebird + Inno Setup installer) and Linux
# (AppImage + RPM). Merged from master.yml + linux-release.yml.
#   master push → Shorebird OTA patch only
#   v* tag      → full releases + GitHub Release

name: Desktop Release (Windows + Linux)

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  shorebird-patch:
    name: Shorebird OTA Patch (Windows)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/master')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Configure Git Long Paths
        run: git config --system core.longpaths true
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true
      - name: Setup Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1
      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Run Static Analysis & Verification
        run: flutter analyze
      - name: Run Complete Test Suite
        run: |
          flutter test
          dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release
      - name: Push Instant Shorebird Patch
        run: shorebird patch windows --dart-define=ED25519_PUBKEY_HEX=bd6b436ee74d9a8a6fae5c720488574c0aac04b561a1810fe8cef0d7cdd84a7c
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  release-windows:
    name: Windows Release (Installer)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Configure Git Long Paths
        run: git config --system core.longpaths true
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true
      - name: Setup Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1
      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Run Static Analysis & Verification
        run: flutter analyze
      - name: Run Complete Test Suite
        run: |
          flutter test
          dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release
      - name: Build Base Shorebird Release
        run: shorebird release windows -- --obfuscate --split-debug-info=symbols --dart-define=ED25519_PUBKEY_HEX=bd6b436ee74d9a8a6fae5c720488574c0aac04b561a1810fe8cef0d7cdd84a7c
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Compile Inno Setup Installer Package
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: innosetup_config.iss
          options: /O+
      - name: Archive Executable Setup Installer File
        uses: actions/upload-artifact@v4
        with:
          name: CashierSystem-Windows-Setup
          path: Output/Setup.exe
      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Setup.exe
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    name: Linux Release (AppImage + RPM)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ED25519_PUBKEY_HEX: ${{ secrets.ED25519_PUBKEY_HEX }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcups2-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libblkid-dev \
            liblzma-dev \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libstdc++-12-dev \
            linuxdeploy \
            appimagetool \
            rpm \
            rpm-build \
            wget \
            curl
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Check Flutter Format
        run: dart format --set-exit-if-changed lib test
      - name: Run Flutter Static Analysis
        run: flutter analyze
      - name: Run All Flutter Unit Tests
        run: flutter test
      - name: Run PrintServer.Linux Tests
        run: dotnet test PrintServer.Linux.Tests/PrintServer.Linux.Tests.csproj -c Release
      - name: Build AppImage Release
        run: |
          chmod +x packaging/linux/AppImage/build-appimage.sh
          ./packaging/linux/AppImage/build-appimage.sh "${VERSION#v}"
        env:
          ED25519_PUBKEY_HEX: ${{ secrets.ED25519_PUBKEY_HEX }}
      - name: Build RPM Release
        run: |
          chmod +x packaging/linux/RPM/build-rpm.sh
          ./packaging/linux/RPM/build-rpm.sh "${VERSION#v}"
        env:
          ED25519_PUBKEY_HEX: ${{ secrets.ED25519_PUBKEY_HEX }}
      - name: Verify AppImage
        run: |
          APPIMAGE=$(ls build/appimage/output/Cashier-System-*.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --version 2>&1 | head -5 || true
          file "$APPIMAGE" | grep -q "ELF.*executable" && echo "✅ AppImage valid"
      - name: Verify RPM
        run: |
          RPM_FILE=$(ls build/rpm/output/cashier-system-*.rpm)
          rpm -qp "$RPM_FILE" --info
          rpm -qpl "$RPM_FILE" | grep -q "cashier-system" && echo "✅ RPM valid"
      - name: Attach Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/appimage/output/Cashier-System-*.AppImage
            build/rpm/output/cashier-system-*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
