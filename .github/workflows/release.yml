# Desktop releases — Windows (Shorebird + Inno Setup installer) and Linux
# (AppImage + RPM). Merged from master.yml + linux-release.yml.
#   master push → Shorebird OTA patch only
#   v* tag      → full releases + GitHub Release

name: Desktop Release (Windows + Linux)

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  shorebird-patch:
    name: Shorebird OTA Patch (Windows)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/master')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2
      - name: Configure Git Long Paths
        run: git config --system core.longpaths true
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: "8.0.x"
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true
      - name: Setup Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1.0.1
      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Run Static Analysis & Verification
        run: flutter analyze
      - name: Run Complete Test Suite
        run: |
          flutter test
          dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release
      - name: Push Instant Shorebird Patch
        run: shorebird patch windows --dart-define=ED25519_PUBKEY_HEX=bd6b436ee74d9a8a6fae5c720488574c0aac04b561a1810fe8cef0d7cdd84a7c
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

  release:
    name: Release (Windows Installer + Linux AppImage/RPM)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Configure Git Long Paths
        if: matrix.platform == 'windows'
        run: git config --system core.longpaths true
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: "8.0.x"
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.47.1"
          channel: "stable"
          cache: true
      - name: Setup Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1.0.1
      - name: Install Flutter Dependencies
        run: flutter pub get
      - name: Run Static Analysis & Verification
        run: flutter analyze

      - name: Run Flutter Tests (Windows)
        if: matrix.platform == 'windows'
        run: flutter test
      - name: Run .NET Tests (Windows)
        if: matrix.platform == 'windows'
        run: dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release
      - name: Run Flutter Tests (Linux)
        if: matrix.platform == 'linux'
        run: flutter test
      - name: Run .NET Tests (Linux)
        if: matrix.platform == 'linux'
        run: dotnet test PrintServer.Linux.Tests/PrintServer.Linux.Tests.csproj -c Release

      - name: Build Windows Installer
        if: matrix.platform == 'windows'
        run: |
          shorebird release windows -- --obfuscate --split-debug-info=symbols --dart-define=ED25519_PUBKEY_HEX=bd6b436ee74d9a8a6fae5c720488574c0aac04b561a1810fe8cef0d7cdd84a7c
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      - name: Compile Inno Setup Installer Package
        if: matrix.platform == 'windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: innosetup_config.iss
          options: /O+
      - name: Archive Executable Setup Installer File
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4.6.0
        with:
          name: CashierSystem-Windows-Setup
          path: Output/Setup.exe

      - name: Install Linux System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcups2-dev \
            libgtk-3-dev \
            libsecret-1-dev \
            libblkid-dev \
            liblzma-dev \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libstdc++-12-dev \
            libfuse2 \
            rpm \
            wget \
            curl \
            xvfb \
            desktop-file-utils \
            libappstream-glib8 \
            libappstream-glib-dev
      - name: Install linuxdeploy
        if: matrix.platform == 'linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy
      - name: Install appimagetool
        if: matrix.platform == 'linux'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
      - name: Build AppImage Release
        if: matrix.platform == 'linux'
        run: |
          chmod +x packaging/linux/AppImage/build-appimage.sh
          ./packaging/linux/AppImage/build-appimage.sh "${VERSION#v}"
        env:
          ED25519_PUBKEY_HEX: ${{ secrets.ED25519_PUBKEY_HEX }}
          VERSION: ${{ github.ref_name }}
      - name: Build RPM Release
        if: matrix.platform == 'linux'
        run: |
          chmod +x packaging/linux/RPM/build-rpm.sh
          ./packaging/linux/RPM/build-rpm.sh "${VERSION#v}"
        env:
          ED25519_PUBKEY_HEX: ${{ secrets.ED25519_PUBKEY_HEX }}
          VERSION: ${{ github.ref_name }}
      - name: Verify AppImage
        if: matrix.platform == 'linux'
        run: |
          APPIMAGE=$(ls build/appimage/output/Cashier-System-*.AppImage)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --version 2>&1 | head -5 || true
          file "$APPIMAGE" | grep -q "ELF.*executable" && echo "✅ AppImage valid"
      - name: Verify RPM
        if: matrix.platform == 'linux'
        run: |
          RPM_FILE=$(ls build/rpm/output/cashier-system-*.rpm)
          rpm -qp "$RPM_FILE" --info
          rpm -qpl "$RPM_FILE" | grep -q "cashier-system" && echo "✅ RPM valid"

      - name: Create/Update Official GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ matrix.platform == 'windows' && 'Output/Setup.exe' || '' }}
            ${{ matrix.platform == 'linux' && 'build/appimage/output/Cashier-System-*.AppImage' || '' }}
            ${{ matrix.platform == 'linux' && 'build/rpm/output/cashier-system-*.rpm' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
