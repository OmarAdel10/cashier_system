name: Production Deployment Engine

on:
  push:
    branches: [master]
    tags: ["v*"] # Triggers whenever you push a tag starting with 'v' (e.g., v1.0.1)

jobs:
  deploy-production:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Git Long Paths
        run: git config --system core.longpaths true

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Install Flutter Dependencies
        run: flutter pub get

      # --- CI CHECK: Protect production by testing everything first ---
      - name: Run Static Analysis & Verification
        run: flutter analyze

      - name: Run Complete Test Suite
        run: |
          flutter test
          dotnet test PrintServer.Tests/PrintServer.Tests.csproj --configuration Release

      # --- CD PATH 1: Automated Over-The-Air Patch ---
      # Runs ONLY on standard pushes to master (NOT when a version tag is created)
      - name: Push Instant Shorebird Patch
        if: "startsWith(github.ref, 'refs/tags/') == false"
        run: shorebird patch windows
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      # --- CD PATH 2: Automated Full Release & Installer Creation ---
      # Runs ONLY when a version tag is pushed (e.g., git push origin v1.0.0)
      - name: Build Base Shorebird Release
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: shorebird release windows -- --obfuscate --split-debug-info=symbols
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Compile Inno Setup Installer Package
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: innosetup_config.iss
          options: /O+

      - name: Archive Executable Setup Installer File
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: CashierSystem-Windows-Setup
          path: Output/Setup.exe

      - name: Create Official GitHub Release
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Setup.exe
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
