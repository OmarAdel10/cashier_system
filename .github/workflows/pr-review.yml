name: pr-review

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - development
      - staging
      - feature/*
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]


jobs:
  pr-review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.comment.body == '/oc review') ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.body == '/oc review')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run flutter analyze
        id: analyze
        run: |
          flutter analyze --format=json > analyze.json 2>&1 || true
          echo "analyze_done=true" >> $GITHUB_OUTPUT

      - name: Run flutter test
        id: test
        run: |
          flutter test --reporter=json > test.json 2>&1 || true
          echo "test_done=true" >> $GITHUB_OUTPUT

      - name: Generate review issues from analysis
        id: generate_issues
        run: |
          # Create empty issues array
          echo '[]' > issues.json
          
          # Parse analyze.json for issues
          if [ -f analyze.json ]; then
            python3 << 'PYEOF'
import json
import sys

try:
    with open('analyze.json', 'r') as f:
        content = f.read().strip()
    
    # flutter analyze --format=json outputs JSON lines (one JSON per line)
    issues = []
    for line in content.split('\n'):
        line = line.strip()
        if not line:
            continue
        try:
            data = json.loads(line)
            # Check if it's an issue object
            if 'severity' in data and 'message' in data:
                file_path = data.get('file', '')
                location = data.get('location', {})
                start_line = location.get('startLine', 1)
                
                severity = data.get('severity', 'info').upper()
                message = data.get('message', '')
                code = data.get('code', '')
                
                issues.append({
                    'file': file_path,
                    'line': start_line,
                    'message': f'{severity}: {message} (code: {code})'
                })
        except json.JSONDecodeError:
            pass
    
    with open('issues.json', 'w') as f:
        json.dump(issues, f)
    
    print(f"Found {len(issues)} issues from flutter analyze")
except Exception as e:
    print(f"Error parsing analyze.json: {e}")
PYEOF
          fi
          
          # Also check test.json for failures
          if [ -f test.json ]; then
            python3 << 'PYEOF'
import json
import sys

try:
    with open('test.json', 'r') as f:
        content = f.read().strip()
    
    # flutter test --reporter=json outputs JSON lines
    test_issues = []
    for line in content.split('\n'):
        line = line.strip()
        if not line:
            continue
        try:
            data = json.loads(line)
            # Check for test failures
            if data.get('type') == 'test' and data.get('result') == 'failure':
                test_issues.append({
                    'file': data.get('file', 'test/unknown'),
                    'line': 1,
                    'message': f'TEST FAILURE: {data.get("name", "Unknown test")} - {data.get("message", "No message")}'
                })
        except json.JSONDecodeError:
            pass
    
    # Merge with existing issues
    with open('issues.json', 'r') as f:
        existing = json.load(f)
    
    all_issues = existing + test_issues
    
    with open('issues.json', 'w') as f:
        json.dump(all_issues, f)
    
    print(f"Total issues after test parsing: {len(all_issues)}")
except Exception as e:
    print(f"Error parsing test.json: {e}")
PYEOF
          fi
          
          # Output issues for next step
          python3 << 'PYEOF'
import json
import os
with open('issues.json', 'r') as f:
    issues = json.load(f)
# Write to GITHUB_OUTPUT
with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
    f.write(f'issues_json={json.dumps(issues)}\n')
PYEOF

      - name: Create review with inline comments
        if: fromJson(steps.generate_issues.outputs.issues_json) != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          
          COMMENTS_JSON="${{ steps.generate_issues.outputs.issues_json }}"
          
          echo "Creating review with $(echo $COMMENTS_JSON | jq length) inline comments"
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/$REPO/pulls/$PR_NUMBER/reviews \
            -f event="COMMENT" \
            -f body="Automated code review found $(echo $COMMENTS_JSON | jq length) issues" \
            -f comments="$COMMENTS_JSON"
