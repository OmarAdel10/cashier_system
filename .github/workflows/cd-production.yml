# Deploys the PRODUCTION environment — v* version tags only.
# Releases are full snapshots: all components deploy (no path filter).

name: Deploy Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  verify:
    name: Production Gate (fmt, analyze, test, backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
          cache-key: flutter-linux-${{ hashFiles('pubspec.lock') }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Unit Tests
        run: flutter test
      - name: Backend Workers tests
        run: |
          for d in api realtime admin_host paymob_webhook shared; do
            echo "::group::backend/$d"
            ( cd "backend/$d" && npm ci --no-audit --no-fund && npm test && npm run typecheck )
            echo "::endgroup::"
          done

  deploy:
    name: Deploy PRODUCTION (Cloudflare)
    needs: [verify]
    uses: ./.github/workflows/deploy-cloud.yml
    with:
      pages_project: daftari
      wrangler_env_flag: '--env production'
      flutter_env: production
      deploy_landing: true
      deploy_admin: true
      deploy_api: true
      deploy_realtime: true
      deploy_paymob: true
    secrets: inherit
