# Deploys the PRODUCTION environment — v* version tags only.
# Releases are full snapshots: all components deploy (no path filter).

name: Deploy Production

on:
  workflow_run:
    workflows: ["CI Checks"]
    types:
      - completed
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    name: Production Gate (fmt, analyze, test, backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Setup Flutter
        uses: subosito/flutter-action@81f14621b3f1e2c8a87f9a8f4b4d4e4f7c2d8b4e  # v2.18.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
          cache-key: flutter-linux-${{ hashFiles('pubspec.lock') }}
      - name: Setup Node.js
        uses: actions/setup-node@60edb3dd545a775178f52524783378180af0d1f8  # v4.0.4
        with:
          # Backend workers declare engines.node >=22 (wrangler 4.x needs it).
          node-version: '22'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Unit Tests
        run: flutter test
      - name: Backend Workers tests
        run: |
          # Shared source is imported by api/realtime — install it (with dev deps) first,
          # mirroring the backend-tests job in ci.yml.
          npm ci --prefix backend/shared --include=dev --no-audit --no-fund
          for d in api realtime admin_host paymob_webhook shared; do
            echo "::group::backend/$d"
            ( cd "backend/$d" && npm ci --include=dev --no-audit --no-fund && npm test -- --passWithNoTests && npm run typecheck )
            echo "::endgroup::"
          done

  deploy:
    name: Deploy PRODUCTION (Cloudflare)
    needs: [verify]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-cloud.yml
    with:
      pages_project: daftari
      pages_branch: master
      wrangler_env_flag: '--env production'
      flutter_env: production
      deploy_landing: true
      deploy_admin: true
      deploy_api: true
      deploy_realtime: true
      deploy_paymob: true
    secrets: inherit
