# Deploys the PRODUCTION environment — v* version tags only.
# Releases are full snapshots: all components deploy (no path filter).

name: Deploy Production

# NOTE: `workflow_run` has no tag filter — `tags:` is silently ignored there.
# The tag match is enforced by the job-level `if` on head_branch below, and the
# `conclusion == 'success'` guard ensures a red CI run never deploys.
on:
  workflow_run:
    workflows: ["CI Checks"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    name: Production Gate (fmt, analyze, test, backend)
    # Only deploy a tag build, and only when CI for that ref succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Setup Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff  # v2.18.0
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
          cache-key: flutter-linux-${{ hashFiles('apps/daftari/pubspec.lock') }}
      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6  # v4.0.4
        with:
          # Backend workers declare engines.node >=22 (wrangler 4.x needs it).
          node-version: '22'
      - name: Install Flutter dependencies
        working-directory: apps/daftari
        run: flutter pub get
      - name: Check Formatting
        working-directory: apps/daftari
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        working-directory: apps/daftari
        run: flutter analyze
      - name: Unit Tests
        working-directory: apps/daftari
        run: flutter test
      - name: Backend Workers tests
        run: |
          # Shared source is imported by api/realtime — install it (with dev deps) first,
          # mirroring the backend-tests job in ci.yml.
          npm ci --prefix backend/shared --include=dev --no-audit --no-fund
          for d in api realtime admin_host paymob_webhook shared; do
            echo "::group::backend/$d"
            ( cd "backend/$d" && npm ci --include=dev --no-audit --no-fund && npm test -- --passWithNoTests && npm run typecheck )
            echo "::endgroup::"
          done

  deploy:
    name: Deploy PRODUCTION (Cloudflare)
    needs: [verify]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-cloud.yml
    with:
      pages_project: daftari
      pages_branch: master
      wrangler_env_flag: '--env production'
      flutter_env: production
      deploy_landing: true
      deploy_admin: true
      deploy_api: true
      deploy_realtime: true
      deploy_paymob: true
    secrets: inherit
