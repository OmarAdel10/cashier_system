name: opencode

on:
  push:
    branches:
      - development
      - feature/*
  pull_request:
    branches:
      - development
      - feature/*
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # opencode job will run when a comment is created on an issue or pull request that contains the /oc or /opencode command.
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/nemotron-3-ultra-free

  # sync_specs job will run when a pull request is opened or updated against the development branch, or when a push is made to the development branch. It will analyze the implementation changes in the lib/ directory and update the spec files in @specs/ accordingly.
  sync_specs:
    if: github.event_name == 'pull_request' && github.base_ref == 'development'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Sync specs
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/nemotron-3-ultra-free
          prompt: |
            You are a GitHub Actions agent. The code is the source of truth.

            1. DETECT TRIGGER CONTEXT:
                - If PR (github.event.pull_request): get base=${{ github.base_ref }}, head=${{ github.head_ref }}
                - If push to development (github.ref == 'refs/heads/development'): compare against origin/development
                - If push to feature/*: compare against origin/development

            2. GET IMPLEMENTATION CHANGES:
                - PR: `git diff origin/${{ github.base_ref }}..HEAD -- lib/`
                - Push to development: `git diff origin/development..HEAD -- lib/` (merge commits: use `git diff $(git merge-base HEAD origin/development)..HEAD -- lib/`)
                - Push to feature/*: `git diff origin/development..HEAD -- lib/`

            3. ANALYZE SPECS GAPS:
                - Read all files in @specs/ (PRD.md, ARCHITECTURE.md, DESIGN.md, USER_FLOW.md, DEVELOPMENT_ENVIRONMENT.md, PERFORMANCE_GUIDELINES.md)
                - Compare implementation changes against documented features
                - Identify features in code NOT documented in specs
                - Identify spec claims NOT present in code

            4. UPDATE SPECS:
                - Edit spec files to document missing implementation features
                - Follow existing format: modules, sections, bullet points
                - Update cross-references (module numbers, feature branch list, hive boxes, etc.)
                - Mark Linux features as "experimental/development only"

            5. VERIFY:
                - `dart format --set-exit-if-changed lib test`
                - `flutter analyze` (must exit 0)
                - If either fails, fix and re-verify

            6. COMMIT & PR:
                - If changes made: commit with emoji-commit format
                - Subject: 📝 docs(specs): sync with <branch> implementation
                - Body: list updated spec files and what gaps were filled
                - Push and create PR to development
                - If no gaps: exit 0 silently (no PR)