# Pull Request path and branch labels used by actions/labeler@v5.
#
# The workflow checks out this repository, so this file is read from the PR
# base ref. Labels should also exist in GitHub; create any missing labels in
# repository Settings -> Labels before relying on them for automation.

# Change type labels. These are also consumed by release-drafter.yml.
feature:
  - head-branch:
      - '^feature/'
      - '^feat/'
      - '(^|/)feature[-/]'
      - '(^|/)feat[-/]'

enhancement:
  - head-branch:
      - '^enhancement/'
      - '(^|/)enhancement[-/]'

fix:
  - head-branch:
      - '^fix/'
      - '^hotfix/'
      - '(^|/)fix[-/]'
      - '(^|/)hotfix[-/]'

bug:
  - head-branch:
      - '^bug/'
      - '^bugfix/'
      - '(^|/)bug[-/]'
      - '(^|/)bugfix[-/]'

chore:
  - head-branch:
      - '^chore/'
      - '(^|/)chore[-/]'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pubspec.yaml'
          - 'pubspec.lock'
          - 'landing_page/pubspec.yaml'
          - 'landing_page/pubspec.lock'
          - 'backend/**/package.json'
          - 'backend/**/package-lock.json'

major:
  - head-branch:
      - '^major/'
      - '^breaking/'
      - '(^|/)major[-/]'
      - '(^|/)breaking[-/]'

minor:
  - head-branch:
      - '^minor/'
      - '(^|/)minor[-/]'

patch:
  - head-branch:
      - '^patch/'
      - '(^|/)patch[-/]'

# Application and service areas.
